name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Locate release notes
        id: check_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Canonical location (Navigator convention)
          PRIMARY="releases/RELEASE-NOTES-v${VERSION}.md"
          # Legacy fallback — pre-v3.x notes lived at repo root
          FALLBACK="RELEASE-NOTES-v${VERSION}.md"

          if [ -f "$PRIMARY" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$PRIMARY" >> $GITHUB_OUTPUT
            echo "Found release notes at $PRIMARY"
          elif [ -f "$FALLBACK" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$FALLBACK" >> $GITHUB_OUTPUT
            echo "Found release notes at $FALLBACK (legacy path)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "path=" >> $GITHUB_OUTPUT
            echo "No release notes file found for v${VERSION}; workflow will fall back to generic body."
          fi

      - name: Determine if pre-release
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            # Check marketplace.json description for "Experimental"
            if grep -q "Experimental" .claude-plugin/marketplace.json; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_PATH: ${{ steps.check_notes.outputs.path }}
          NOTES_EXISTS: ${{ steps.check_notes.outputs.exists }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          ARGS=(
            "$TAG"
            --title "Navigator $TAG"
          )

          if [ "$NOTES_EXISTS" = "true" ]; then
            ARGS+=(--notes-file "$NOTES_PATH")
            ARGS+=("$NOTES_PATH")
          else
            ARGS+=(--notes "Release $TAG"$'\n\n'"See commit history for changes.")
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"

      - name: Verify marketplace compatibility
        run: |
          echo "✅ Release ${{ steps.version.outputs.tag }} published"
          echo ""
          echo "📦 Marketplace will auto-update from:"
          echo "   https://github.com/alekspetrov/navigator/releases/tag/${{ steps.version.outputs.tag }}"
          echo ""
          echo "Users can update with:"
          echo "   /plugin update navigator"
          echo ""
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]; then
            echo "⚠️  This is a PRE-RELEASE"
            echo "   Latest stable API endpoint will not show this version"
            echo "   Users need to explicitly opt-in to pre-releases"
          fi
